services:
  web:
    build: .
    image: hobby-portfolio:0.1.0
    container_name: hobby-portfolio
    restart: unless-stopped
    ports:
      - "5175:80"

  # The same site under the name "Chin", to share on dates.
  dating:
    build:
      context: .
      args:
        OWNER: Chin
    image: hobby-portfolio-dating:0.1.0
    container_name: hobby-portfolio-dating
    restart: unless-stopped
    ports:
      - "5176:80"
