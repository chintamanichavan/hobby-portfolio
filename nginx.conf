server {
  listen 80;
  root /usr/share/nginx/html;

  # The site is a single-page app: unknown paths are routes, so serve the shell.
  # Always check for a newer page, so a rebuild shows up on a plain reload.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }

  # Built assets carry a content hash in their names and never change.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
